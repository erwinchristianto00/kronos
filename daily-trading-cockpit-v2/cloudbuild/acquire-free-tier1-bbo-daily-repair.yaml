# Cloud-only repair of the exact verified Binance Vision daily bookTicker files
# that cover the two stale quote intervals found in the frozen monthly archive.
# It never downloads to the laptop, mutates the original 22-object monthly
# bundle, or permits a daily object to enter the Foundry before checksum and ZIP
# integrity verification.
steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: acquire-verify-free-tier1-daily-bookticker-repairs
    env:
      - _STUDY=${_STUDY}
      - _BASE_MONTHLY_BUNDLE_HASH=${_BASE_MONTHLY_BUNDLE_HASH}
      - _VERIFIER_SOURCE_REVISION=${_VERIFIER_SOURCE_REVISION}
      - _VERIFIER_TEMPLATE_SHA256=${_VERIFIER_TEMPLATE_SHA256}
      - BUILD_ID=${BUILD_ID}
    script: |
        #!/usr/bin/env bash
        set -eu
        python3 - <<'PY'
        import datetime
        import hashlib
        import json
        import os
        import pathlib
        import re
        import shutil
        import subprocess
        import urllib.request
        import zipfile

        study = os.environ["_STUDY"]
        base_bundle = os.environ["_BASE_MONTHLY_BUNDLE_HASH"]
        source_revision = os.environ["_VERIFIER_SOURCE_REVISION"]
        template_sha = os.environ["_VERIFIER_TEMPLATE_SHA256"]
        build_id = os.environ.get("BUILD_ID")
        if not re.fullmatch(r"[a-f0-9]{64}", base_bundle):
            raise RuntimeError("daily repair requires the frozen monthly raw bundle hash")
        if not re.fullmatch(r"[a-f0-9]{7,64}", source_revision) or not re.fullmatch(r"[a-f0-9]{64}", template_sha):
            raise RuntimeError("daily repair verifier provenance is invalid")
        if not build_id or not re.fullmatch(r"[A-Za-z0-9-]+", build_id):
            raise RuntimeError("daily repair build identity is invalid")

        repairs = [
            ("BTCUSDT", "2023-05-16"), ("ETHUSDT", "2023-05-16"),
            ("BTCUSDT", "2023-05-17"), ("ETHUSDT", "2023-05-17"),
            ("BTCUSDT", "2023-09-21"), ("ETHUSDT", "2023-09-21"),
            ("BTCUSDT", "2023-09-22"), ("ETHUSDT", "2023-09-22"),
        ]
        repairs.sort()
        work = pathlib.Path("/workspace/daily-bookticker-repair")
        work.mkdir(parents=True, exist_ok=True)
        s3_base = "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision"

        def run(*args):
            return subprocess.check_output(args, text=True)

        def describe(uri):
            return json.loads(run("gcloud", "storage", "objects", "describe", uri, "--format=json"))

        def exists(uri):
            result = subprocess.run(["gcloud", "storage", "objects", "describe", uri, "--format=json"], text=True, capture_output=True)
            if result.returncode == 0:
                return json.loads(result.stdout)
            if "No URLs matched" in result.stderr or "not found" in result.stderr.lower():
                return None
            raise RuntimeError(f"cannot inspect canonical object {uri}: {result.stderr}")

        def sha256(path):
            digest = hashlib.sha256()
            with open(path, "rb") as handle:
                for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                    digest.update(chunk)
            return digest.hexdigest()

        def sha256_bytes(value):
            return hashlib.sha256(value).hexdigest()

        def assert_active_verifier_template():
            build = json.loads(run("gcloud", "builds", "describe", build_id, "--format=json"))
            script = next((step.get("script") for step in build.get("steps", []) if step.get("id") == "acquire-verify-free-tier1-daily-bookticker-repairs"), None)
            if not isinstance(script, str) or sha256_bytes(script.encode()) != template_sha:
                raise RuntimeError("active daily repair verifier template hash mismatch")

        def gcs_copy(uri, generation, destination):
            destination.parent.mkdir(parents=True, exist_ok=True)
            subprocess.check_call(["gcloud", "storage", "cp", "--do-not-decompress", f"{uri}#{generation}", str(destination)])

        def assert_frozen_monthly_manifest():
            uri = f"{study}/acquisition-manifests/v2/{base_bundle}.json"
            metadata = describe(uri)
            local = work / "base-monthly-acquisition-manifest.json"
            gcs_copy(uri, str(metadata["generation"]), local)
            bytes_value = local.read_bytes()
            if not bytes_value.endswith(b"\n"):
                raise RuntimeError("frozen monthly acquisition manifest has no terminal newline")
            manifest = json.loads(bytes_value)
            expected_paths = sorted(
                f"{symbol}/{symbol}-bookTicker-{month}.zip"
                for symbol in ("BTCUSDT", "ETHUSDT")
                for month in [*(f"2023-{number:02d}" for number in range(5, 13)), *(f"2024-{number:02d}" for number in range(1, 4))]
            )
            objects = manifest.get("objects")
            if (
                manifest.get("schemaVersion") != "KronosFreeTier1RawAcquisition/v2"
                or manifest.get("canonicalRawBookTickerBundleHash") != base_bundle
                or manifest.get("inventoryPassHash") != base_bundle
                or manifest.get("secondInventoryPassHash") != base_bundle
                or manifest.get("scope", {}).get("objectCount") != 22
                or not isinstance(objects, list)
                or [entry.get("relativePath") for entry in objects] != expected_paths
                or sha256_bytes(json.dumps(objects, sort_keys=True, separators=(",", ":")).encode()) != base_bundle
            ):
                raise RuntimeError("frozen monthly acquisition manifest identity invalid")
            for entry in objects:
                canonical = entry.get("canonical", {})
                companion = entry.get("companion", {})
                canonical_meta = describe(canonical.get("uri", ""))
                companion_meta = describe(companion.get("uri", ""))
                if (
                    str(canonical_meta.get("generation")) != str(canonical.get("generation"))
                    or int(canonical_meta.get("size", -1)) != int(canonical.get("sizeBytes", -2))
                    or str(companion_meta.get("generation")) != str(companion.get("generation"))
                    or int(companion_meta.get("size", -1)) != int(companion.get("sizeBytes", -2))
                ):
                    raise RuntimeError(f"frozen monthly canonical generation mismatch {entry.get('relativePath')}")
            return {"uri": uri, "generation": str(metadata["generation"]), "sha256": sha256_bytes(bytes_value)}

        def immutable_upload(source, uri):
            result = subprocess.run(["gcloud", "storage", "cp", str(source), uri, "--if-generation-match=0"], text=True, capture_output=True)
            if result.returncode == 0:
                return describe(uri)
            existing_meta = exists(uri)
            if existing_meta is None:
                raise RuntimeError(f"immutable upload failed for {uri}: {result.stderr}")
            existing = work / "existing" / hashlib.sha256(uri.encode()).hexdigest()
            gcs_copy(uri, str(existing_meta["generation"]), existing)
            if existing.read_bytes() != source.read_bytes():
                raise RuntimeError(f"immutable object conflict {uri}")
            return existing_meta

        def source_request(url, destination=None):
            request = urllib.request.Request(url, headers={"User-Agent": "Kronos-Free-Tier1-Foundry/1.0"}, method="GET" if destination else "HEAD")
            with urllib.request.urlopen(request, timeout=120) as response:
                metadata = {
                    "url": url,
                    "httpStatus": int(response.status),
                    "lastModified": response.headers.get("Last-Modified"),
                    "contentLength": response.headers.get("Content-Length"),
                }
                if destination is not None:
                    destination.parent.mkdir(parents=True, exist_ok=True)
                    with destination.open("wb") as handle:
                        shutil.copyfileobj(response, handle, length=8 * 1024 * 1024)
                return metadata

        def validate_pair(zip_path, checksum_path, name, expected_checksum_bytes=None):
            checksum_bytes = checksum_path.read_bytes()
            if expected_checksum_bytes is not None and checksum_bytes != expected_checksum_bytes:
                raise RuntimeError(f"canonical checksum companion differs from official source {name}")
            try:
                checksum = checksum_bytes.decode("utf8").strip()
            except UnicodeDecodeError as error:
                raise RuntimeError(f"checksum is not UTF-8 for {name}") from error
            match = re.fullmatch(r"([a-fA-F0-9]{64})\s+([^\s]+)", checksum)
            if match is None or match.group(2) != name:
                raise RuntimeError(f"official checksum format invalid for {name}")
            computed = sha256(zip_path)
            if computed != match.group(1).lower():
                raise RuntimeError(f"official checksum mismatch for {name}")
            with zipfile.ZipFile(zip_path) as archive:
                bad_member = archive.testzip()
                if bad_member is not None:
                    raise RuntimeError(f"ZIP integrity failed {name}: {bad_member}")
            return {"computedZipSha256": computed, "checksumBytes": checksum_bytes, "officialSha256": match.group(1).lower()}

        assert_active_verifier_template()
        base_monthly_manifest = assert_frozen_monthly_manifest()

        def canonical_entry(symbol, day):
            name = f"{symbol}-bookTicker-{day}.zip"
            source_key = f"data/futures/um/daily/bookTicker/{symbol}/{name}"
            source_url = f"{s3_base}/{source_key}"
            checksum_url = f"{source_url}.CHECKSUM"
            final_uri = f"{study}/raw/bookTicker-daily-repair/v1/{symbol}/{name}"
            companion_uri = f"{final_uri}.CHECKSUM"
            marker_uri = f"{study}/raw/bookTicker-daily-repair/v1/verification-markers/{symbol}/{name}.json"
            local_root = work / symbol / day
            zip_path = local_root / name
            checksum_path = local_root / f"{name}.CHECKSUM"
            marker_meta = exists(marker_uri)
            final_meta = exists(final_uri)
            checksum_meta = exists(companion_uri)

            if final_meta is None:
                source_zip = source_request(source_url, zip_path)
                source_checksum = source_request(checksum_url, checksum_path)
                source_validated = validate_pair(zip_path, checksum_path, name)
                final_meta = immutable_upload(zip_path, final_uri)
                checksum_meta = immutable_upload(checksum_path, companion_uri)
            else:
                gcs_copy(final_uri, str(final_meta["generation"]), zip_path)
                if marker_meta is None:
                    source_zip = source_request(source_url)
                    source_checksum = source_request(checksum_url, checksum_path)
                    source_validated = validate_pair(zip_path, checksum_path, name)
                    if checksum_meta is None:
                        checksum_meta = immutable_upload(checksum_path, companion_uri)
                else:
                    source_zip = None
                    source_checksum = None
                    source_validated = None
                    if checksum_meta is None:
                        raise RuntimeError(f"verified daily object is missing its checksum companion {name}")
                    gcs_copy(companion_uri, str(checksum_meta["generation"]), checksum_path)

            if int(final_meta["size"]) != zip_path.stat().st_size or int(checksum_meta["size"]) != checksum_path.stat().st_size:
                raise RuntimeError(f"canonical size mismatch for {name}")
            canonical_zip_path = local_root / f"canonical-{name}"
            canonical_checksum_path = local_root / f"canonical-{name}.CHECKSUM"
            gcs_copy(final_uri, str(final_meta["generation"]), canonical_zip_path)
            gcs_copy(companion_uri, str(checksum_meta["generation"]), canonical_checksum_path)
            validated = validate_pair(
                canonical_zip_path,
                canonical_checksum_path,
                name,
                source_validated["checksumBytes"] if source_validated is not None else None,
            )
            if int(final_meta["size"]) != canonical_zip_path.stat().st_size or int(checksum_meta["size"]) != canonical_checksum_path.stat().st_size:
                raise RuntimeError(f"canonical GCS readback size mismatch for {name}")

            if marker_meta is not None:
                marker_path = local_root / f"{name}.marker.json"
                gcs_copy(marker_uri, str(marker_meta["generation"]), marker_path)
                marker = json.loads(marker_path.read_text(encoding="utf8"))
                if (
                    marker.get("schemaVersion") != "KronosFreeTier1DailyBookTickerRepairVerification/v1"
                    or marker.get("sourceKey") != source_key
                    or marker.get("sourceUrl") != source_url
                    or marker.get("officialSha256") != validated["officialSha256"]
                    or marker.get("computedFinalSha256") != validated["computedZipSha256"]
                    or marker.get("companionSha256") != sha256(canonical_checksum_path)
                    or marker.get("finalUri") != final_uri
                    or str(marker.get("finalGeneration")) != str(final_meta["generation"])
                    or marker.get("companionUri") != companion_uri
                    or str(marker.get("companionGeneration")) != str(checksum_meta["generation"])
                    or marker.get("verifierSourceRevision") != source_revision
                    or marker.get("verifierTemplateSha256") != template_sha
                ):
                    raise RuntimeError(f"immutable verification marker mismatch for {name}")
            else:
                if source_zip is None:
                    source_zip = source_request(source_url)
                if source_checksum is None:
                    source_checksum = source_request(checksum_url)
                marker = {
                    "schemaVersion": "KronosFreeTier1DailyBookTickerRepairVerification/v1",
                    "sourceKey": source_key,
                    "sourceUrl": source_url,
                    "sourceZip": source_zip,
                    "sourceChecksum": source_checksum,
                    "officialSha256": validated["officialSha256"],
                    "computedFinalSha256": validated["computedZipSha256"],
                    "companionSha256": sha256(canonical_checksum_path),
                    "finalUri": final_uri,
                    "finalGeneration": str(final_meta["generation"]),
                    "finalSizeBytes": int(final_meta["size"]),
                    "companionUri": companion_uri,
                    "companionGeneration": str(checksum_meta["generation"]),
                    "companionSizeBytes": int(checksum_meta["size"]),
                    "zipIntegrity": "python.zipfile.testzip",
                    "verifierSourceRevision": source_revision,
                    "verifierTemplateSha256": template_sha,
                }
                marker_path = local_root / f"{name}.marker.json"
                marker_path.write_text(json.dumps(marker, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf8")
                marker_meta = immutable_upload(marker_path, marker_uri)
                marker_path.unlink()
                gcs_copy(marker_uri, str(marker_meta["generation"]), marker_path)
                if json.loads(marker_path.read_text(encoding="utf8")) != marker:
                    raise RuntimeError(f"immutable marker readback mismatch for {name}")

            marker_path = local_root / f"{name}.marker.json"
            if not marker_path.exists():
                gcs_copy(marker_uri, str(marker_meta["generation"]), marker_path)
            marker_hash = sha256(marker_path)
            audit = {
                "schemaVersion": "KronosFreeTier1DailyBookTickerRepairAudit/v1",
                "buildId": build_id,
                "auditedAt": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
                "sourceKey": source_key,
                "sourceZip": source_zip,
                "sourceChecksum": source_checksum,
                "finalUri": final_uri,
                "finalGeneration": str(final_meta["generation"]),
                "computedFinalSha256": validated["computedZipSha256"],
                "markerUri": marker_uri,
                "markerGeneration": str(marker_meta["generation"]),
                "markerSha256": marker_hash,
            }
            audit_path = local_root / f"{name}.audit.json"
            audit_path.write_text(json.dumps(audit, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf8")
            audit_uri = f"{study}/raw/bookTicker-daily-repair/v1/verification-audits/{build_id}/{symbol}/{name}.json"
            immutable_upload(audit_path, audit_uri)
            return {
                "relativePath": f"{symbol}/{name}",
                "sourceKey": source_key,
                "sourceUrl": source_url,
                "canonical": {"uri": final_uri, "generation": str(final_meta["generation"]), "sizeBytes": int(final_meta["size"]), "sha256": validated["computedZipSha256"]},
                "officialChecksum": validated["officialSha256"],
                "companion": {"uri": companion_uri, "generation": str(checksum_meta["generation"]), "sizeBytes": int(checksum_meta["size"]), "sha256": sha256(canonical_checksum_path), "bytes": validated["checksumBytes"].decode("utf8").strip()},
                "verificationMarker": {"uri": marker_uri, "generation": str(marker_meta["generation"]), "sha256": marker_hash},
            }

        objects = sorted((canonical_entry(symbol, day) for symbol, day in repairs), key=lambda value: value["relativePath"])
        bundle_hash = hashlib.sha256(json.dumps(objects, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
        manifest = {
            "schemaVersion": "KronosFreeTier1DailyBookTickerRepair/v1",
            "baseMonthlyRawBundleHash": base_bundle,
            "baseMonthlyAcquisitionManifest": base_monthly_manifest,
            "scope": {"symbols": ["BTCUSDT", "ETHUSDT"], "days": ["2023-05-16", "2023-05-17", "2023-09-21", "2023-09-22"], "objectCount": len(objects)},
            "canonicalDailyRepairBundleHash": bundle_hash,
            "verification": {"zipIntegrity": "python.zipfile.testzip", "verifierSourceRevision": source_revision, "verifierTemplateSha256": template_sha},
            "objects": objects,
        }
        output = work / f"{bundle_hash}.json"
        output.write_text(json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf8")
        target = f"{study}/acquisition-manifests/daily-repair-v1/{bundle_hash}.json"
        immutable_upload(output, target)
        manifest_meta = describe(target)
        reread = work / "reread-manifest.json"
        gcs_copy(target, str(manifest_meta["generation"]), reread)
        if reread.read_bytes() != output.read_bytes():
            raise RuntimeError("immutable daily repair manifest readback mismatch")
        print(json.dumps({"status": "PASS", "objectCount": len(objects), "baseMonthlyRawBundleHash": base_bundle, "canonicalDailyRepairBundleHash": bundle_hash, "manifest": target, "manifestGeneration": str(manifest_meta["generation"])}, sort_keys=True))
        PY
options:
  diskSizeGb: 100
  machineType: E2_HIGHCPU_8
timeout: 3600s
substitutions:
  _STUDY: gs://bucket-coin-yuhu/kronos-tier1-archives/binance-vision-usdm-bookticker-free-walkforward-v1
  _BASE_MONTHLY_BUNDLE_HASH: 3338e528944869fec5b2ce112cdeedac7aa1fe031563a141a57babf4ad39584a
  _VERIFIER_SOURCE_REVISION: unknown
  _VERIFIER_TEMPLATE_SHA256: unknown
