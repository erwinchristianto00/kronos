  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: persist-sealed-holdout
    entrypoint: bash
    env:
      - _STUDY=${_STUDY}
    args:
      - -ceu
      - |
        python3 - <<'PY'
        import hashlib, json, os, pathlib, subprocess

        study = os.environ["_STUDY"]
        root = pathlib.Path("/workspace/holdout-runs")
        report = pathlib.Path("/workspace/sealed-holdout.json")
        payload = json.loads(report.read_text(encoding="utf8"))
        if payload.get("status") != "SEALED_HOLDOUT_EVALUATED_NO_CANDIDATE_CLAIM" or not payload.get("reportHash") or not payload.get("oosFreezeReportHash"):
            raise RuntimeError("sealed holdout report is invalid")
        prefix = study + f"/empirical/walk-forward-v1/sealed-holdout/{payload['reportHash']}"

        def sha256(path):
            digest = hashlib.sha256()
            with path.open("rb") as handle:
                for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                    digest.update(chunk)
            return digest.hexdigest()

        def stable(value):
            return json.dumps(value, sort_keys=True, separators=(",", ":"))

        def immutable_upload(source, target):
            result = subprocess.run(["gcloud", "storage", "cp", str(source), target, "--if-generation-match=0"], text=True, capture_output=True)
            if result.returncode == 0:
                return
            existing = pathlib.Path("/workspace/holdout-existing") / hashlib.sha256(target.encode()).hexdigest()
            existing.parent.mkdir(parents=True, exist_ok=True)
            subprocess.check_call(["gcloud", "storage", "cp", target, str(existing)])
            if sha256(existing) != sha256(source):
                raise RuntimeError(f"immutable holdout object conflict: {target}")

        def describe(uri):
            return json.loads(subprocess.check_output(["gcloud", "storage", "objects", "describe", uri, "--format=json"], text=True))

        objects = []
        for source in sorted(path for path in root.rglob("*") if path.is_file()):
            relative = source.relative_to(root).as_posix()
            target = prefix + "/runs/" + relative
            immutable_upload(source, target)
            meta = describe(target)
            objects.append({"relativePath": relative, "uri": target, "generation": str(meta["generation"]), "sizeBytes": int(meta["size"]), "sha256": sha256(source)})
        report_target = prefix + "/sealed-holdout.json"
        immutable_upload(report, report_target)
        report_meta = describe(report_target)
        core = {
            "schemaVersion": "KronosFreeTier1SealedHoldoutPublication/v1",
            "reportHash": payload["reportHash"],
            "oosFreezeReportHash": payload["oosFreezeReportHash"],
            "report": {"uri": report_target, "generation": str(report_meta["generation"]), "sizeBytes": int(report_meta["size"]), "sha256": sha256(report)},
            "runObjects": objects,
        }
        publication_hash = hashlib.sha256(stable(core).encode()).hexdigest()
        publication = {**core, "publicationHash": publication_hash}
        publication_path = pathlib.Path("/workspace/sealed-holdout-publication.json")
        publication_path.write_text(stable(publication) + "\n", encoding="utf8")
        publication_target = prefix + f"/publication/{publication_hash}.json"
        immutable_upload(publication_path, publication_target)
        print(json.dumps({"status": "PASS", "holdoutReport": report_target, "holdoutReportHash": payload["reportHash"], "publication": publication_target, "publicationHash": publication_hash}, sort_keys=True))
