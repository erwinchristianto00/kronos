# Converts already-verified cloud archives into reusable Foundry inputs. It is
# research-only: no runtime, deployment, or empirical tournament execution.
steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: stage-generation-pinned-raw
    entrypoint: bash
    env:
      - _STUDY=${_STUDY}
      - _BBO_RAW_BUNDLE_HASH=${_BBO_RAW_BUNDLE_HASH}
      - _BBO_DAILY_REPAIR_BUNDLE_HASH=${_BBO_DAILY_REPAIR_BUNDLE_HASH}
      - _LIFECYCLE_LAUNCH_BUNDLE_HASH=${_LIFECYCLE_LAUNCH_BUNDLE_HASH}
      - _LIFECYCLE_DELISTING_BUNDLE_HASH=${_LIFECYCLE_DELISTING_BUNDLE_HASH}
    args:
      - -ceu
      - |
        python3 - <<'PY'
        import json
        import os
        import pathlib
        import subprocess

        study = os.environ["_STUDY"]
        raw_root = pathlib.Path("/workspace/raw")
        raw_root.mkdir(parents=True, exist_ok=True)
        bbo_hash = os.environ["_BBO_RAW_BUNDLE_HASH"]
        repair_hash = os.environ["_BBO_DAILY_REPAIR_BUNDLE_HASH"]

        def run(*args):
            return subprocess.check_output(args, text=True)

        def describe(uri):
            return json.loads(run("gcloud", "storage", "objects", "describe", uri, "--format=json"))

        def copy(uri, generation, destination):
            destination.parent.mkdir(parents=True, exist_ok=True)
            subprocess.check_call(["gcloud", "storage", "cp", "--do-not-decompress", f"{uri}#{generation}", str(destination)])

        inventory = {"schemaVersion": "KronosFreeTier1PrelifecycleGcsInventory/v1", "study": study, "objects": []}
        manifest_uri = f"{study}/acquisition-manifests/v2/{bbo_hash}.json"
        manifest_meta = describe(manifest_uri)
        copy(manifest_uri, str(manifest_meta["generation"]), raw_root / "bbo-raw-acquisition-manifest.json")
        inventory["objects"].append({"role": "bookTickerRawManifest", "uri": manifest_uri, "generation": str(manifest_meta["generation"]), "sizeBytes": int(manifest_meta["size"]), "relativePath": "bbo-raw-acquisition-manifest.json"})
        manifest = json.loads((raw_root / "bbo-raw-acquisition-manifest.json").read_text(encoding="utf8"))
        if manifest.get("schemaVersion") != "KronosFreeTier1RawAcquisition/v2" or manifest.get("canonicalRawBookTickerBundleHash") != bbo_hash or len(manifest.get("objects", [])) != 22:
            raise RuntimeError("frozen BBO raw manifest is invalid")
        for entry in manifest["objects"]:
            zip_meta = entry["canonical"]
            checksum_meta = entry["companion"]
            relative = entry["relativePath"]
            copy(zip_meta["uri"], str(zip_meta["generation"]), raw_root / "bookTicker" / relative)
            copy(checksum_meta["uri"], str(checksum_meta["generation"]), raw_root / "bookTicker" / f"{relative}.CHECKSUM")
            inventory["objects"].append({"role": "bookTicker", "uri": zip_meta["uri"], "generation": str(zip_meta["generation"]), "sizeBytes": int(zip_meta["sizeBytes"]), "relativePath": f"bookTicker/{relative}"})
            inventory["objects"].append({"role": "bookTickerChecksum", "uri": checksum_meta["uri"], "generation": str(checksum_meta["generation"]), "sizeBytes": int(checksum_meta["sizeBytes"]), "relativePath": f"bookTicker/{relative}.CHECKSUM"})

        repair_manifest_uri = f"{study}/acquisition-manifests/daily-repair-v1/{repair_hash}.json"
        repair_manifest_meta = describe(repair_manifest_uri)
        copy(repair_manifest_uri, str(repair_manifest_meta["generation"]), raw_root / "bbo-daily-repair-acquisition-manifest.json")
        inventory["objects"].append({"role": "bookTickerDailyRepairManifest", "uri": repair_manifest_uri, "generation": str(repair_manifest_meta["generation"]), "sizeBytes": int(repair_manifest_meta["size"]), "relativePath": "bbo-daily-repair-acquisition-manifest.json"})
        repair_manifest = json.loads((raw_root / "bbo-daily-repair-acquisition-manifest.json").read_text(encoding="utf8"))
        if repair_manifest.get("schemaVersion") != "KronosFreeTier1DailyBookTickerRepair/v1" or repair_manifest.get("baseMonthlyRawBundleHash") != bbo_hash or repair_manifest.get("canonicalDailyRepairBundleHash") != repair_hash or len(repair_manifest.get("objects", [])) != 6:
            raise RuntimeError("frozen daily BBO repair manifest is invalid")
        for entry in repair_manifest["objects"]:
            zip_meta = entry["canonical"]
            checksum_meta = entry["companion"]
            relative = entry["relativePath"]
            copy(zip_meta["uri"], str(zip_meta["generation"]), raw_root / "bookTicker-daily-repair" / "v1" / relative)
            copy(checksum_meta["uri"], str(checksum_meta["generation"]), raw_root / "bookTicker-daily-repair" / "v1" / f"{relative}.CHECKSUM")
            inventory["objects"].extend([
                {"role": "bookTickerDailyRepair", "uri": zip_meta["uri"], "generation": str(zip_meta["generation"]), "sizeBytes": int(zip_meta["sizeBytes"]), "relativePath": f"bookTicker-daily-repair/v1/{relative}"},
                {"role": "bookTickerDailyRepairChecksum", "uri": checksum_meta["uri"], "generation": str(checksum_meta["generation"]), "sizeBytes": int(checksum_meta["sizeBytes"]), "relativePath": f"bookTicker-daily-repair/v1/{relative}.CHECKSUM"},
            ])

        lifecycle_catalogs = [
            (48, "v1", os.environ["_LIFECYCLE_LAUNCH_BUNDLE_HASH"], "launch"),
            (161, "v2", os.environ["_LIFECYCLE_DELISTING_BUNDLE_HASH"], "delisting"),
        ]
        for catalog_id, version, bundle_hash, bundle_role in lifecycle_catalogs:
            lifecycle_prefix = f"{study}/raw/lifecycle-binance-cms-catalog-{catalog_id}/{version}/{bundle_hash}"
            lifecycle_manifest_uri = f"{lifecycle_prefix}/acquisition-manifest.json"
            lifecycle_manifest_meta = describe(lifecycle_manifest_uri)
            lifecycle_root = raw_root / "lifecycle" / bundle_role
            lifecycle_manifest_path = lifecycle_root / "acquisition-manifest.json"
            copy(lifecycle_manifest_uri, str(lifecycle_manifest_meta["generation"]), lifecycle_manifest_path)
            lifecycle_manifest = json.loads(lifecycle_manifest_path.read_text(encoding="utf8"))
            if (
                lifecycle_manifest.get("status") != "RAW_CATALOG_ACQUIRED_NOT_A_TIMELINE"
                or lifecycle_manifest.get("provider") != "Binance"
                or lifecycle_manifest.get("exchange") != "BINANCE_USDM"
                or lifecycle_manifest.get("datasetId") != f"binance-cms-public-announcements-catalog-{catalog_id}"
                or lifecycle_manifest.get("catalog", {}).get("catalogId") != catalog_id
                or lifecycle_manifest.get("archiveBundleHash") != bundle_hash
                or not lifecycle_manifest.get("requests")
            ):
                raise RuntimeError(f"frozen lifecycle catalog manifest is invalid: {catalog_id}")
            inventory["objects"].append({"role": f"lifecycleCatalog{catalog_id}Manifest", "uri": lifecycle_manifest_uri, "generation": str(lifecycle_manifest_meta["generation"]), "sizeBytes": int(lifecycle_manifest_meta["size"]), "relativePath": str(lifecycle_manifest_path.relative_to(raw_root))})
            for request in lifecycle_manifest["requests"]:
                relative = request.get("relativePath")
                if not relative or relative == "acquisition-manifest.json" or relative.startswith("/") or ".." in pathlib.PurePosixPath(relative).parts:
                    raise RuntimeError(f"lifecycle manifest request path is invalid: {catalog_id}")
                request_uri = f"{lifecycle_prefix}/{relative}"
                request_meta = describe(request_uri)
                if int(request_meta["size"]) != int(request.get("sizeBytes", -1)):
                    raise RuntimeError(f"lifecycle GCS object size mismatches immutable manifest: {catalog_id}/{relative}")
                copy(request_uri, str(request_meta["generation"]), lifecycle_root / relative)
                inventory["objects"].append({"role": f"lifecycleCatalog{catalog_id}Request", "uri": request_uri, "generation": str(request_meta["generation"]), "sizeBytes": int(request_meta["size"]), "relativePath": str((lifecycle_root / relative).relative_to(raw_root))})

        months = [*(f"2023-{month:02d}" for month in range(4, 13)), *(f"2024-{month:02d}" for month in range(1, 4))]
        funding_months = [*(f"2023-{month:02d}" for month in range(5, 13)), *(f"2024-{month:02d}" for month in range(1, 4))]
        for symbol in ("BTCUSDT", "ETHUSDT"):
            for month in months:
                name = f"{symbol}-1h-{month}.zip"
                uri = f"{study}/raw/klines/{symbol}/1h/{name}"
                meta = describe(uri)
                checksum_uri = f"{uri}.CHECKSUM"; checksum_meta = describe(checksum_uri)
                copy(uri, str(meta["generation"]), raw_root / "klines" / symbol / "1h" / name)
                copy(checksum_uri, str(checksum_meta["generation"]), raw_root / "klines" / symbol / "1h" / f"{name}.CHECKSUM")
                inventory["objects"].extend([
                    {"role": "kline", "uri": uri, "generation": str(meta["generation"]), "sizeBytes": int(meta["size"]), "relativePath": f"klines/{symbol}/1h/{name}"},
                    {"role": "klineChecksum", "uri": checksum_uri, "generation": str(checksum_meta["generation"]), "sizeBytes": int(checksum_meta["size"]), "relativePath": f"klines/{symbol}/1h/{name}.CHECKSUM"},
                ])
            for month in funding_months:
                name = f"{symbol}-fundingRate-{month}.zip"
                uri = f"{study}/raw/fundingRate/{symbol}/{name}"
                meta = describe(uri)
                checksum_uri = f"{uri}.CHECKSUM"; checksum_meta = describe(checksum_uri)
                copy(uri, str(meta["generation"]), raw_root / "fundingRate" / symbol / name)
                copy(checksum_uri, str(checksum_meta["generation"]), raw_root / "fundingRate" / symbol / f"{name}.CHECKSUM")
                inventory["objects"].extend([
                    {"role": "funding", "uri": uri, "generation": str(meta["generation"]), "sizeBytes": int(meta["size"]), "relativePath": f"fundingRate/{symbol}/{name}"},
                    {"role": "fundingChecksum", "uri": checksum_uri, "generation": str(checksum_meta["generation"]), "sizeBytes": int(checksum_meta["size"]), "relativePath": f"fundingRate/{symbol}/{name}.CHECKSUM"},
                ])
        inventory["objects"].sort(key=lambda entry: (entry["relativePath"], entry["role"]))
        (raw_root / "source-gcs-inventory.json").write_text(json.dumps(inventory, sort_keys=True, separators=(",", ":")), encoding="utf8")
        PY
  - name: node:22-bookworm
    id: build-prelifecycle-artifacts
    entrypoint: bash
    env:
      - RAW_ROOT=/workspace/raw
      - ARTIFACT_ROOT=/workspace/foundry-artifacts
      - REPORT_PATH=/workspace/prelifecycle-report.json
      - GENERATED_AT_MS=${_GENERATED_AT_MS}
      - GENERATION_SHA=${_GENERATION_SHA}
      - BBO_RAW_BUNDLE_HASH=${_BBO_RAW_BUNDLE_HASH}
      - BBO_DAILY_REPAIR_BUNDLE_HASH=${_BBO_DAILY_REPAIR_BUNDLE_HASH}
      - LIFECYCLE_LAUNCH_BUNDLE_HASH=${_LIFECYCLE_LAUNCH_BUNDLE_HASH}
      - LIFECYCLE_DELISTING_BUNDLE_HASH=${_LIFECYCLE_DELISTING_BUNDLE_HASH}
    args:
      - -ceu
      - |
        apt-get update -qq
        apt-get install -y --no-install-recommends unzip
        npm ci --ignore-scripts
        # Execute pinned TypeScript sources directly. The preceding GCS stage
        # contains the immutable 90 GB corpus, so a redundant declaration build
        # must not sit between raw verification and Foundry processing.
        npx --no-install tsx scripts/research/precompute-free-tier1-prelifecycle.mjs build
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: persist-and-reload-artifacts
    entrypoint: bash
    env:
      - _STUDY=${_STUDY}
    args:
      - -ceu
      - |
        python3 - <<'PY'
        import hashlib
        import os
        import pathlib
        import subprocess

        root = pathlib.Path("/workspace/foundry-artifacts")
        partial_root = os.environ["_STUDY"] + "/foundry-partials/v2"
        target_root = partial_root + "/artifacts"
        reload_root = pathlib.Path("/workspace/foundry-reload")

        def sha256(path):
            digest = hashlib.sha256()
            with path.open("rb") as handle:
                for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                    digest.update(chunk)
            return digest.hexdigest()

        def immutable_upload(source, target):
            result = subprocess.run(["gcloud", "storage", "cp", str(source), target, "--if-generation-match=0"], text=True, capture_output=True)
            if result.returncode == 0:
                return
            existing = pathlib.Path("/workspace/existing") / hashlib.sha256(target.encode()).hexdigest()
            existing.parent.mkdir(parents=True, exist_ok=True)
            subprocess.check_call(["gcloud", "storage", "cp", target, str(existing)])
            if sha256(existing) != sha256(source):
                raise RuntimeError(f"immutable object conflict: {target}")

        inventory = pathlib.Path("/workspace/raw/source-gcs-inventory.json")
        immutable_upload(inventory, partial_root + "/input-manifests/" + sha256(inventory) + ".json")
        for artifact_dir in sorted(path for path in root.iterdir() if path.is_dir()):
            for name in ("manifest.json", "rows.json"):
                source = artifact_dir / name
                if not source.is_file():
                    raise RuntimeError(f"artifact file missing: {source}")
                target = f"{target_root}/{artifact_dir.name}/{name}"
                immutable_upload(source, target)
                destination = reload_root / artifact_dir.name / name
                destination.parent.mkdir(parents=True, exist_ok=True)
                subprocess.check_call(["gcloud", "storage", "cp", target, str(destination)])
        PY
  - name: node:22-bookworm
    id: verify-gcs-reload
    entrypoint: bash
    env:
      - RELOAD_ROOT=/workspace/foundry-reload
      - REPORT_PATH=/workspace/prelifecycle-report.json
      - FINAL_REPORT_PATH=/workspace/prelifecycle-report-gcs-reloaded.json
    args:
      - -ceu
      - |
        npx --no-install tsx scripts/research/precompute-free-tier1-prelifecycle.mjs verify
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: persist-final-report
    entrypoint: bash
    env:
      - _STUDY=${_STUDY}
    args:
      - -ceu
      - |
        python3 - <<'PY'
        import hashlib
        import json
        import os
        import pathlib
        import subprocess

        study = os.environ["_STUDY"]
        partial_root = study + "/foundry-partials/v2"
        report = pathlib.Path("/workspace/prelifecycle-report-gcs-reloaded.json")
        payload = json.loads(report.read_text(encoding="utf8"))

        def sha256(path):
            digest = hashlib.sha256()
            with path.open("rb") as handle:
                for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                    digest.update(chunk)
            return digest.hexdigest()

        def immutable_upload(source, target):
            result = subprocess.run(["gcloud", "storage", "cp", str(source), target, "--if-generation-match=0"], text=True, capture_output=True)
            if result.returncode == 0:
                return
            existing = pathlib.Path("/workspace/existing-final") / hashlib.sha256(target.encode()).hexdigest()
            existing.parent.mkdir(parents=True, exist_ok=True)
            subprocess.check_call(["gcloud", "storage", "cp", target, str(existing)])
            if sha256(existing) != sha256(source):
                raise RuntimeError(f"immutable object conflict: {target}")

        def describe(uri):
            return json.loads(subprocess.check_output(["gcloud", "storage", "objects", "describe", uri, "--format=json"], text=True))

        report_target = partial_root + f"/reports/{payload['reportHash']}.json"
        immutable_upload(report, report_target)
        report_meta = describe(report_target)
        artifact_objects = []
        for artifact in payload["artifacts"]:
            for name in ("manifest.json", "rows.json"):
                source = pathlib.Path("/workspace/foundry-artifacts") / artifact["semanticManifestHash"] / name
                target = partial_root + f"/artifacts/{artifact['semanticManifestHash']}/{name}"
                meta = describe(target)
                artifact_objects.append({"artifactRole": artifact["name"], "semanticManifestHash": artifact["semanticManifestHash"], "name": name, "uri": target, "generation": str(meta["generation"]), "sizeBytes": int(meta["size"]), "sha256": sha256(source)})
        publication_core = {
            "schemaVersion": "KronosFreeTier1FoundryArtifactPublication/v2",
            "status": payload["status"],
            "sourceGcsInventoryHash": payload["sourceGcsInventoryHash"],
            "rawBookTickerBundleHash": payload["frozenBookTicker"]["rawManifestBundleHash"],
            "report": {"reportHash": payload["reportHash"], "uri": report_target, "generation": str(report_meta["generation"]), "sizeBytes": int(report_meta["size"]), "sha256": sha256(report)},
            "artifactObjects": sorted(artifact_objects, key=lambda entry: (entry["semanticManifestHash"], entry["name"])),
            "realTier1Blockers": payload["realTier1Blockers"],
            "empiricalExecutionForbidden": True,
        }
        publication_hash = hashlib.sha256(json.dumps(publication_core, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
        publication = {**publication_core, "publicationHash": publication_hash}
        publication_path = pathlib.Path("/workspace/prelifecycle-publication.json")
        publication_path.write_text(json.dumps(publication, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf8")
        publication_target = partial_root + f"/publications/{publication_hash}.json"
        immutable_upload(publication_path, publication_target)
        print(json.dumps({"status": "PASS", "report": report_target, "reportHash": payload["reportHash"], "publication": publication_target, "publicationHash": publication_hash}, sort_keys=True))
        PY
  # OOS is persisted and re-read from immutable GCS before the sealed holdout
  # process is even started.  Both use only the verified local staging from the
  # preceding Foundry build and never accept a caller market-data payload.
  - name: node:22-bookworm
    id: run-oos-walk-forward
    entrypoint: bash
    env:
      - RAW_ROOT=/workspace/raw
      - ARTIFACT_ROOT=/workspace/foundry-artifacts
      - FOUNDRY_REPORT_PATH=/workspace/prelifecycle-report-gcs-reloaded.json
      - RUN_ROOT=/workspace/oos-runs
      - REPORT_PATH=/workspace/oos-freeze.json
      - CREATED_AT_MS=${_GENERATED_AT_MS}
      - GENERATION_SHA=${_GENERATION_SHA}
    args:
      - -ceu
      - |
        npx --no-install tsx scripts/research/run-free-tier1-walk-forward.mjs oos
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: persist-and-reload-oos-freeze
    entrypoint: bash
    env:
      - _STUDY=${_STUDY}
    args:
      - -ceu
      - |
        python3 - <<'PY'
        import hashlib, json, os, pathlib, subprocess

        study = os.environ["_STUDY"]
        root = pathlib.Path("/workspace/oos-runs")
        report = pathlib.Path("/workspace/oos-freeze.json")
        payload = json.loads(report.read_text(encoding="utf8"))
        if payload.get("status") != "OOS_FROZEN_PENDING_SEALED_HOLDOUT" or not payload.get("reportHash"):
            raise RuntimeError("OOS freeze report is invalid")
        prefix = study + f"/empirical/walk-forward-v1/oos/{payload['reportHash']}"

        def sha256(path):
            digest = hashlib.sha256()
            with path.open("rb") as handle:
                for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                    digest.update(chunk)
            return digest.hexdigest()

        def stable(value):
            return json.dumps(value, sort_keys=True, separators=(",", ":"))

        def immutable_upload(source, target):
            result = subprocess.run(["gcloud", "storage", "cp", str(source), target, "--if-generation-match=0"], text=True, capture_output=True)
            if result.returncode == 0:
                return
            existing = pathlib.Path("/workspace/oos-existing") / hashlib.sha256(target.encode()).hexdigest()
            existing.parent.mkdir(parents=True, exist_ok=True)
            subprocess.check_call(["gcloud", "storage", "cp", target, str(existing)])
            if sha256(existing) != sha256(source):
                raise RuntimeError(f"immutable OOS object conflict: {target}")

        def describe(uri):
            return json.loads(subprocess.check_output(["gcloud", "storage", "objects", "describe", uri, "--format=json"], text=True))

        objects = []
        for source in sorted(path for path in root.rglob("*") if path.is_file()):
            relative = source.relative_to(root).as_posix()
            target = prefix + "/runs/" + relative
            immutable_upload(source, target)
            meta = describe(target)
            objects.append({"relativePath": relative, "uri": target, "generation": str(meta["generation"]), "sizeBytes": int(meta["size"]), "sha256": sha256(source)})
        report_target = prefix + "/oos-freeze.json"
        immutable_upload(report, report_target)
        report_meta = describe(report_target)
        core = {
            "schemaVersion": "KronosFreeTier1OosPublication/v1",
            "reportHash": payload["reportHash"],
            "report": {"uri": report_target, "generation": str(report_meta["generation"]), "sizeBytes": int(report_meta["size"]), "sha256": sha256(report)},
            "runObjects": objects,
        }
        publication_hash = hashlib.sha256(stable(core).encode()).hexdigest()
        publication = {**core, "publicationHash": publication_hash}
        publication_path = pathlib.Path("/workspace/oos-freeze-publication.json")
        publication_path.write_text(stable(publication) + "\n", encoding="utf8")
        publication_target = prefix + f"/publication/{publication_hash}.json"
        immutable_upload(publication_path, publication_target)
        # The holdout may only consume a fresh GCS read, never this build's
        # original OOS in-memory file.
        reloaded = pathlib.Path("/workspace/oos-freeze-gcs-reloaded.json")
        subprocess.check_call(["gcloud", "storage", "cp", f"{report_target}#{report_meta['generation']}", str(reloaded)])
        if sha256(reloaded) != sha256(report):
            raise RuntimeError("OOS freeze GCS reload mismatch")
        print(json.dumps({"status": "PASS", "oosReport": report_target, "oosReportHash": payload["reportHash"], "publication": publication_target, "publicationHash": publication_hash}, sort_keys=True))
        PY
