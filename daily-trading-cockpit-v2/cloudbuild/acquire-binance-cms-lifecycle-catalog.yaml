# Cloud-only immutable acquisition of Binance's public announcement catalogue.
# The crawler only preserves raw source evidence; state interpretation stays
# fail-closed in the Foundry lifecycle adapter.
steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: acquire-binance-cms-lifecycle-catalog
    entrypoint: bash
    env:
      - _STUDY=${_STUDY}
      - _GENERATION_SHA=${_GENERATION_SHA}
      - _CATALOG_ID=${_CATALOG_ID}
      - _FETCH_ALL_DETAILS=${_FETCH_ALL_DETAILS}
    args:
      - -ceu
      - |
        python3 scripts/research/acquire-binance-cms-lifecycle-catalog.py
timeout: 1800s
substitutions:
  _STUDY: gs://bucket-coin-yuhu/kronos-tier1-archives/binance-vision-usdm-bookticker-free-walkforward-v1
  _CATALOG_ID: "48"
  _FETCH_ALL_DETAILS: "false"
  _GENERATION_SHA: unknown
